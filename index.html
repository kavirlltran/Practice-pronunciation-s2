<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pronunciation Practice</title>
  <style>
    /* Tổng thể reset và font */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: url('https://source.unsplash.com/1600x900/?education,learning') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      padding: 20px;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
    }
    .container {
      max-width: 800px;
      margin: auto;
      background: rgba(0, 0, 0, 0.6);
      padding: 20px;
      border-radius: 8px;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
      font-weight: bold;
    }
    /* Danh sách nội dung (các dòng) */
    #content-list {
      margin-bottom: 20px;
    }
    .line {
      padding: 10px;
      margin-bottom: 10px;
      border: 2px solid transparent;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s, border-color 0.3s;
    }
    .line:hover {
      background: rgba(255,255,255,0.1);
    }
    .line.selected {
      background: rgba(255,255,255,0.2);
      border-color: #FFD700;
    }
    /* Mỗi từ được bọc trong span */
    .word {
      font-weight: bold;
      padding: 0 3px;
      transition: transform 0.2s;
    }
    .word.stressed {
      /* Những từ cần nhấn trọng âm có viền nổi bật */
      border-bottom: 2px dashed #FFD700;
    }
    .word.error {
      color: #FF6347;
    }
    /* Các nút điều khiển */
    #controls {
      text-align: center;
      margin-bottom: 20px;
    }
    button {
      font-size: 1rem;
      padding: 10px 20px;
      margin: 0 10px;
      border: none;
      border-radius: 5px;
      background: #FFD700;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
      transition: background 0.3s;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    button:hover:not(:disabled) {
      background: #FFC107;
    }
    /* Kết quả hiển thị sau khi ghi âm */
    #result {
      font-size: 1.2rem;
      text-align: center;
      padding: 10px;
    }
    /* Responsive */
    @media (max-width: 600px) {
      h1 {
        font-size: 1.5rem;
      }
      button {
        width: 100%;
        margin-bottom: 10px;
      }
      #controls {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Pronunciation Practice</h1>
    <p>Chọn một dòng nội dung dưới đây trước khi bắt đầu ghi âm:</p>
    <div id="content-list">
      <!-- Các dòng nội dung sẽ được tạo bằng JS -->
    </div>
    <div id="controls">
      <button id="startBtn">Start Recording</button>
      <button id="stopBtn" disabled>Stop Recording</button>
    </div>
    <div id="result"></div>
  </div>

  <script>
    /***********************************************************************
     * Dữ liệu nguồn: 5 dòng nội dung. Trong đó, các từ có dấu ‘ là cần
     * được nhấn trọng âm.
     ***********************************************************************/
    const rawLines = [
      "We should ‘finish the ‘project for our ‘history ‘class",
      "‘Peter is re‘vising for his e‘xam ‘next ‘week.",
      "‘Students will ‘spend more ‘time ‘working with ‘other ‘classmates.",
      "I ‘like to ‘watch ‘videos that ‘help me ‘learn ‘new ‘things",
      "I have ‘installed some ‘apps on my ‘phone"
    ];

    // Biến lưu trữ nội dung đã được parse: mỗi dòng là một object chứa mảng từ và thông tin trọng âm
    const parsedLines = rawLines.map((line, index) => {
      // Tách từ bằng khoảng trắng; giữ lại dấu câu nếu có.
      const words = line.split(' ').map(word => {
        // Nếu từ có chứa ký tự ‘, thì đánh dấu stressed = true và loại bỏ ký tự đó ra khỏi hiển thị
        const stressed = word.includes("‘");
        // Loại bỏ tất cả ký tự ‘ (có thể có ở đầu, giữa hay cuối từ)
        const cleanWord = word.replace(/‘/g, '');
        return { text: cleanWord, stressed };
      });
      return { id: index, words };
    });

    let selectedLineId = null;

    // Render nội dung các dòng ra giao diện
    const contentListEl = document.getElementById("content-list");
    function renderContentList() {
      contentListEl.innerHTML = "";
      parsedLines.forEach(lineObj => {
        const lineDiv = document.createElement("div");
        lineDiv.classList.add("line");
        lineDiv.dataset.id = lineObj.id;
        // Tạo HTML cho từng từ
        lineObj.words.forEach(wordObj => {
          const span = document.createElement("span");
          span.classList.add("word");
          if (wordObj.stressed) {
            span.classList.add("stressed");
          }
          span.textContent = wordObj.text + " ";
          lineDiv.appendChild(span);
        });
        // Khi người dùng click vào dòng, đánh dấu dòng được chọn
        lineDiv.addEventListener("click", () => {
          // Xóa lớp selected của các dòng khác
          document.querySelectorAll(".line").forEach(el => el.classList.remove("selected"));
          lineDiv.classList.add("selected");
          selectedLineId = lineObj.id;
          // Xoá kết quả cũ nếu có
          document.getElementById("result").textContent = "";
        });
        contentListEl.appendChild(lineDiv);
      });
    }
    renderContentList();

    /***********************************************************************
     * Các biến và hàm liên quan đến ghi âm, nhận dạng giọng nói và phân tích âm
     ***********************************************************************/
    let recognition;          // SpeechRecognition instance
    let finalTranscript = ""; // Nội dung nhận dạng được
    let mediaStream = null;
    let audioContext = null;
    let analyser = null;
    let silenceStart = null;
    let silenceInterval = null;
    const SILENCE_THRESHOLD = 0.02; // ngưỡng năng lượng (có thể điều chỉnh)
    const SILENCE_DURATION = 6000;  // 6000 ms = 6 giây

    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const resultEl = document.getElementById("result");

    // Khởi tạo SpeechRecognition (chú ý: dùng webkitSpeechRecognition cho Chrome)
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      alert("Trình duyệt của bạn không hỗ trợ Speech Recognition API.");
    }

    function startRecording() {
      // Kiểm tra đã chọn dòng chưa
      if (selectedLineId === null) {
        alert("Vui lòng chọn một dòng nội dung trước khi ghi âm.");
        return;
      }
      finalTranscript = "";
      resultEl.textContent = "Đang ghi âm...";
      startBtn.disabled = true;
      stopBtn.disabled = false;

      // Yêu cầu quyền truy cập Micro với Web Audio API để phân tích im lặng
      navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
        mediaStream = stream;
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioContext.createMediaStreamSource(stream);
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 2048;
        source.connect(analyser);
        monitorSilence(); // Bắt đầu giám sát im lặng
      }).catch(err => {
        console.error("Lỗi khi truy cập Micro:", err);
        alert("Không thể truy cập micro.");
      });

      // Khởi tạo và bắt đầu SpeechRecognition
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = false;
      recognition.lang = "en-US";
      recognition.start();

      recognition.onresult = (event) => {
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            finalTranscript += event.results[i][0].transcript + " ";
          }
        }
      };

      recognition.onerror = (event) => {
        console.error("Speech recognition error", event.error);
      };

      recognition.onend = () => {
        // Khi dừng ghi âm tự động hay bằng nút
        stopRecording();
      };
    }

    function stopRecording() {
      if (recognition) {
        recognition.stop();
      }
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
      }
      if (audioContext) {
        audioContext.close();
      }
      clearInterval(silenceInterval);
      startBtn.disabled = false;
      stopBtn.disabled = true;

      // Khi ghi âm dừng, so sánh nội dung đã đọc với nội dung mong đợi
      compareTranscript();
    }

    // Hàm theo dõi năng lượng âm thanh để tự dừng ghi âm khi im lặng trên 6s
    function monitorSilence() {
      silenceStart = null;
      silenceInterval = setInterval(() => {
        if (!analyser) return;
        const dataArray = new Uint8Array(analyser.fftSize);
        analyser.getByteTimeDomainData(dataArray);
        // Tính giá trị trung bình bình phương (RMS)
        let sumSquares = 0;
        for (let i = 0; i < dataArray.length; i++) {
          const normalized = (dataArray[i] - 128) / 128;
          sumSquares += normalized * normalized;
        }
        const rms = Math.sqrt(sumSquares / dataArray.length);

        if (rms < SILENCE_THRESHOLD) {
          if (!silenceStart) {
            silenceStart = Date.now();
          } else {
            const silenceDuration = Date.now() - silenceStart;
            if (silenceDuration > SILENCE_DURATION) {
              // Nếu im lặng hơn 6 giây thì dừng ghi âm
              console.log("Detected silence for " + silenceDuration + "ms. Stopping...");
              stopRecording();
            }
          }
        } else {
          // Có tiếng -> reset bộ đếm im lặng
          silenceStart = null;
        }
      }, 200);
    }

    // Sự kiện click nút
    startBtn.addEventListener("click", startRecording);
    stopBtn.addEventListener("click", stopRecording);

    /***********************************************************************
     * So sánh nội dung được đọc (finalTranscript) với nội dung mong đợi
     * của dòng được chọn. Mục đích: nếu đọc sai hoặc nhấn trọng âm không đúng,
     * đánh dấu các từ đó màu đỏ và đưa ra hướng dẫn bằng SpeechSynthesis.
     ***********************************************************************/
    function compareTranscript() {
      // Lấy dòng dữ liệu đã chọn
      const expectedLine = parsedLines.find(line => line.id === Number(selectedLineId));
      if (!expectedLine) return;

      // Tạo chuỗi mong đợi bằng cách nối các từ với khoảng trắng, chuyển về chữ thường
      const expectedText = expectedLine.words.map(w => w.text).join(" ").trim().toLowerCase();
      // Xử lý finalTranscript: loại bỏ khoảng trắng thừa, dấu câu, chuyển về chữ thường
      const recognizedText = finalTranscript.trim().toLowerCase().replace(/[.,?!]/g, "");
      console.log("Expected:", expectedText);
      console.log("Recognized:", recognizedText);

      // Tách thành mảng từ
      const expectedWords = expectedText.split(" ");
      const recognizedWords = recognizedText.split(" ");

      // So sánh từng từ (so sánh đơn giản theo vị trí)
      const lineDiv = document.querySelector(`.line[data-id="${selectedLineId}"]`);
      let errorsFound = false;
      let feedbackMessages = [];

      // Duyệt qua các từ hiển thị trong dòng
      const wordSpans = lineDiv.querySelectorAll(".word");
      expectedWords.forEach((word, index) => {
        // Lấy span tương ứng
        const span = wordSpans[index];
        // Nếu không có từ tương ứng trong transcript hoặc khác nhau, đánh dấu lỗi
        if (!recognizedWords[index] || recognizedWords[index] !== word) {
          span.classList.add("error");
          errorsFound = true;
          // Nếu từ này cần nhấn trọng âm, gợi ý đặc biệt
          if (expectedLine.words[index].stressed) {
            feedbackMessages.push(`Remember to emphasize the word "${word}"`);
          } else {
            feedbackMessages.push(`Please pronounce the word "${word}" correctly`);
          }
        } else {
          // Nếu đúng, đảm bảo xóa lớp error
          span.classList.remove("error");
        }
      });

      // Hiển thị kết quả
      if (!errorsFound) {
        resultEl.textContent = "Excellent! Your pronunciation is correct.";
      } else {
        resultEl.innerHTML = feedbackMessages.join("<br/>");
        // Dùng SpeechSynthesis để đọc hướng dẫn cho người dùng
        speakFeedback(feedbackMessages.join(". "));
      }
    }

    // Hàm sử dụng SpeechSynthesis để đưa ra hướng dẫn bằng âm thanh
    function speakFeedback(message) {
      if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(message);
        utterance.lang = "en-US";
        window.speechSynthesis.speak(utterance);
      }
    }

    /***********************************************************************
     * Một vài gợi ý mở rộng:
     * - Cải tiến thuật toán so sánh transcript: dùng diff hoặc forced alignment
     *   để so sánh từng từ/syllable chính xác hơn.
     * - Tích hợp thư viện phân tích pitch (ví dụ: pitchfinder) để kiểm tra mức
     *   độ cao/âm lượng của các từ cần nhấn trọng âm.
     * - Thêm hướng dẫn video hoặc hình ảnh động cho cách đặt trọng âm.
     * - Lưu lại lịch sử luyện tập của người dùng (localStorage hoặc backend)
     * - Hỗ trợ đa ngôn ngữ và giao diện người dùng tinh tế hơn.
     ***********************************************************************/
  </script>
</body>
</html>
