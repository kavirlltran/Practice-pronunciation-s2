<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pronunciation Practice</title>
  <style>
    /* Basic Reset & Styling */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: url('https://source.unsplash.com/1600x900/?education,learning') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      padding: 20px;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
    }
    .container {
      max-width: 800px;
      margin: auto;
      background: rgba(0, 0, 0, 0.6);
      padding: 20px;
      border-radius: 8px;
    }
    h1 { text-align: center; margin-bottom: 20px; font-weight: bold; }
    #content-list { margin-bottom: 20px; }
    .line {
      padding: 10px;
      margin-bottom: 10px;
      border: 2px solid transparent;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s, border-color 0.3s;
    }
    .line:hover { background: rgba(255,255,255,0.1); }
    .line.selected { background: rgba(255,255,255,0.2); border-color: #FFD700; }
    .word { font-weight: bold; padding: 0 3px; }
    .word.stressed { border-bottom: 2px dashed #FFD700; }
    .word.error { color: #FF6347; }
    #controls { text-align: center; margin-bottom: 20px; }
    button {
      font-size: 1rem;
      padding: 10px 20px;
      margin: 0 10px;
      border: none;
      border-radius: 5px;
      background: #FFD700;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
      transition: background 0.3s;
    }
    button:disabled { background: #ccc; cursor: not-allowed; }
    button:hover:not(:disabled) { background: #FFC107; }
    /* Evaluation result styling */
    #result {
      font-size: 1.4rem;
      text-align: center;
      padding: 15px;
      border: 2px solid #FFD700;
      border-radius: 5px;
      margin-top: 20px;
    }
    @media (max-width: 600px) {
      h1 { font-size: 1.5rem; }
      button { width: 100%; margin-bottom: 10px; }
      #controls { display: flex; flex-direction: column; align-items: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Pronunciation Practice</h1>
    <p>Please select a line before recording:</p>
    <div id="content-list"></div>
    <div id="controls">
      <button id="startBtn">Start Recording</button>
      <button id="stopBtn" disabled>Stop Recording</button>
    </div>
    <div id="result"></div>
  </div>

  <script>
    /***********************************************************************
     * Source data: 5 lines (words with a leading ‘ indicate stressed words)
     ***********************************************************************/
    const rawLines = [
      "We should ‘finish the ‘project for our ‘history ‘class",
      "‘Peter is re‘vising for his e‘xam ‘next ‘week.",
      "‘Students will ‘spend more ‘time ‘working with ‘other ‘classmates.",
      "I ‘like to ‘watch ‘videos that ‘help me ‘learn ‘new ‘things",
      "I have ‘installed some ‘apps on my ‘phone"
    ];

    const parsedLines = rawLines.map((line, index) => {
      const words = line.split(' ').map(word => {
        const stressed = word.includes("‘");
        const cleanWord = word.replace(/‘/g, '');
        return { text: cleanWord, stressed };
      });
      return { id: index, words };
    });

    let selectedLineId = null;
    const contentListEl = document.getElementById("content-list");

    function renderContentList() {
      contentListEl.innerHTML = "";
      parsedLines.forEach(lineObj => {
        const lineDiv = document.createElement("div");
        lineDiv.classList.add("line");
        lineDiv.dataset.id = lineObj.id;
        lineObj.words.forEach(wordObj => {
          const span = document.createElement("span");
          span.classList.add("word");
          if (wordObj.stressed) span.classList.add("stressed");
          span.textContent = wordObj.text + " ";
          lineDiv.appendChild(span);
        });
        lineDiv.addEventListener("click", () => {
          document.querySelectorAll(".line").forEach(el => el.classList.remove("selected"));
          lineDiv.classList.add("selected");
          selectedLineId = lineObj.id;
          document.getElementById("result").textContent = "";
        });
        contentListEl.appendChild(lineDiv);
      });
    }
    renderContentList();

    /***********************************************************************
     * Audio & Speech Recognition Setup
     ***********************************************************************/
    let recognition, finalTranscript = "";
    let mediaStream = null, audioContext = null, analyser = null, silenceStart = null, silenceInterval = null;
    const SILENCE_THRESHOLD = 0.02;
    const SILENCE_DURATION = 30000; // 30 seconds of silence

    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const resultEl = document.getElementById("result");

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      alert("Your browser does not support the Speech Recognition API.");
    }

    function startRecording() {
      if (selectedLineId === null) {
        alert("Please select a line before recording.");
        return;
      }
      finalTranscript = "";
      resultEl.textContent = "Recording...";
      startBtn.disabled = true;
      stopBtn.disabled = false;

      navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
        mediaStream = stream;
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioContext.createMediaStreamSource(stream);
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 2048;
        source.connect(analyser);
        monitorSilence();
      }).catch(err => {
        console.error("Error accessing microphone:", err);
        alert("Unable to access the microphone.");
      });

      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = false;
      recognition.lang = "en-US";
      recognition.start();

      recognition.onresult = (event) => {
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            finalTranscript += event.results[i][0].transcript + " ";
          }
        }
      };

      recognition.onerror = (event) => {
        console.error("Speech recognition error:", event.error);
      };

      recognition.onend = () => {
        stopRecording();
      };
    }

    function stopRecording() {
      if (recognition) recognition.stop();
      if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());
      if (audioContext) audioContext.close();
      clearInterval(silenceInterval);
      startBtn.disabled = false;
      stopBtn.disabled = true;
      evaluatePronunciation();
    }

    // Monitor the audio energy and auto-stop if silence > 30s
    function monitorSilence() {
      silenceStart = null;
      silenceInterval = setInterval(() => {
        if (!analyser) return;
        const dataArray = new Uint8Array(analyser.fftSize);
        analyser.getByteTimeDomainData(dataArray);
        let sumSquares = 0;
        for (let i = 0; i < dataArray.length; i++) {
          const normalized = (dataArray[i] - 128) / 128;
          sumSquares += normalized * normalized;
        }
        const rms = Math.sqrt(sumSquares / dataArray.length);
        if (rms < SILENCE_THRESHOLD) {
          if (!silenceStart) {
            silenceStart = Date.now();
          } else if (Date.now() - silenceStart > SILENCE_DURATION) {
            console.log("Silence detected for over 30 seconds. Stopping recording...");
            stopRecording();
          }
        } else {
          silenceStart = null;
        }
      }, 200);
    }

    startBtn.addEventListener("click", startRecording);
    stopBtn.addEventListener("click", stopRecording);

    /***********************************************************************
     * Evaluate pronunciation:
     * - Compare expected vs recognized transcript.
     * - Group identical error messages.
     * - Highlight errors by marking words in red.
     ***********************************************************************/
    function evaluatePronunciation() {
      const expectedLine = parsedLines.find(line => line.id === Number(selectedLineId));
      if (!expectedLine) return;
      
      const expectedText = expectedLine.words.map(w => w.text).join(" ").trim().toLowerCase();
      const recognizedText = finalTranscript.trim().toLowerCase().replace(/[.,?!]/g, "");
      console.log("Expected:", expectedText);
      console.log("Recognized:", recognizedText);

      const expectedWords = expectedText.split(" ");
      const recognizedWords = recognizedText.split(" ");
      const lineDiv = document.querySelector(`.line[data-id="${selectedLineId}"]`);
      let errorsFound = false;
      const errorMessages = {};

      const wordSpans = lineDiv.querySelectorAll(".word");
      expectedWords.forEach((word, index) => {
        const span = wordSpans[index];
        if (!recognizedWords[index] || recognizedWords[index] !== word) {
          span.classList.add("error");
          errorsFound = true;
          let message = expectedLine.words[index].stressed ?
                        `Emphasize "${word}"` :
                        `Pronounce "${word}" correctly`;
          errorMessages[message] = true;
        } else {
          span.classList.remove("error");
        }
      });

      if (!errorsFound) {
        resultEl.innerHTML = "<span style='color:#00FF00;'>Excellent! Your pronunciation is correct.</span>";
      } else {
        const messages = Object.keys(errorMessages).join("; ");
        resultEl.innerHTML = `<span style='color:#FF6347;'>Issues: ${messages}</span>`;
        speakFeedback(messages);
      }
    }

    // Provide audio feedback using SpeechSynthesis
    function speakFeedback(message) {
      if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(message);
        utterance.lang = "en-US";
        window.speechSynthesis.speak(utterance);
      }
    }
  </script>
</body>
</html>
