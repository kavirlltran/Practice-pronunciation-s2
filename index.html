<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pronunciation Practice</title>
  <style>
    /* Basic Reset & Styling */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: url('https://source.unsplash.com/1600x900/?education,learning') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      padding: 20px;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
    }
    .container {
      max-width: 800px;
      margin: auto;
      background: rgba(0, 0, 0, 0.6);
      padding: 20px;
      border-radius: 8px;
    }
    h1 { text-align: center; margin-bottom: 20px; font-weight: bold; }
    /* Phần nội dung chính (5 dòng) luôn hiển thị */
    #content-list { margin-bottom: 20px; }
    .line {
      padding: 10px;
      margin-bottom: 10px;
      border: 2px solid transparent;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s, border-color 0.3s;
    }
    .line:hover { background: rgba(255,255,255,0.1); }
    .line.selected { background: rgba(255,255,255,0.2); border-color: #FFD700; }
    .word { font-weight: bold; padding: 0 3px; }
    .word.stressed { border-bottom: 2px dashed #FFD700; }
    .word.error { color: #FF6347; }
    /* Nút điều khiển */
    #controls { text-align: center; margin-bottom: 20px; }
    button {
      font-size: 1rem;
      padding: 10px 20px;
      margin: 0 10px;
      border: none;
      border-radius: 5px;
      background: #FFD700;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
      transition: background 0.3s;
    }
    button:disabled { background: #ccc; cursor: not-allowed; }
    button:hover:not(:disabled) { background: #FFC107; }
    /* Khu vực Feedback (đánh giá) */
    #result {
      font-size: 1.4rem;
      text-align: center;
      padding: 15px;
      border: 2px solid #FFD700;
      border-radius: 5px;
      margin-top: 20px;
    }
    /* Định dạng feedback theo 2 màu:
       • Prefix (ví dụ: "Issue: Pronounce") với màu cam đỏ.
       • Các từ lỗi (ví dụ: "that", "me") với màu vàng. */
    .msg-prefix { color: #FF6347; }
    .error-word { color: #FFD700; }
    @media (max-width: 600px) {
      h1 { font-size: 1.5rem; }
      button { width: 100%; margin-bottom: 10px; }
      #controls { display: flex; flex-direction: column; align-items: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Pronunciation Practice</h1>
    <p>Please select a line before recording:</p>
    <!-- Phần nội dung chính luôn hiển thị -->
    <div id="content-list"></div>
    <div id="controls">
      <button id="startBtn">Start Recording</button>
      <button id="stopBtn" disabled>Stop Recording</button>
    </div>
    <!-- Khu vực Feedback (đánh giá) - chỉ xuất hiện khi có lỗi -->
    <div id="result"></div>
  </div>

  <script>
    /***********************************************************************
     * SOURCE DATA: 5 lines (a leading ‘ indicates a stressed word)
     ***********************************************************************/
    const rawLines = [
      "We should ‘finish the ‘project for our ‘history ‘class",
      "‘Peter is re‘vising for his e‘xam ‘next ‘week.",
      "‘Students will ‘spend more ‘time ‘working with ‘other ‘classmates.",
      "I ‘like to ‘watch ‘videos that ‘help me ‘learn ‘new ‘things",
      "I have ‘installed some ‘apps on my ‘phone"
    ];

    // Tách dòng thành các từ và đánh dấu từ cần nhấn (stressed)
    const parsedLines = rawLines.map((line, index) => {
      const words = line.split(' ').map(word => {
        const stressed = word.includes("‘");
        const cleanWord = word.replace(/‘/g, '');
        return { text: cleanWord, stressed };
      });
      return { id: index, words };
    });

    let selectedLineId = null;
    const contentListEl = document.getElementById("content-list");

    // Render main content (5 lines)
    function renderContentList() {
      contentListEl.innerHTML = "";
      parsedLines.forEach(lineObj => {
        const lineDiv = document.createElement("div");
        lineDiv.classList.add("line");
        lineDiv.dataset.id = lineObj.id;
        lineObj.words.forEach(wordObj => {
          const span = document.createElement("span");
          span.classList.add("word");
          if (wordObj.stressed) span.classList.add("stressed");
          span.textContent = wordObj.text + " ";
          lineDiv.appendChild(span);
        });
        lineDiv.addEventListener("click", () => {
          // Khi chọn dòng, đánh dấu selected (nội dung chính không bị xoá)
          document.querySelectorAll(".line").forEach(el => el.classList.remove("selected"));
          lineDiv.classList.add("selected");
          selectedLineId = lineObj.id;
          // Chỉ xoá feedback, không xoá nội dung chính
          document.getElementById("result").textContent = "";
        });
        contentListEl.appendChild(lineDiv);
      });
    }
    renderContentList();

    /***********************************************************************
     * AUDIO & SPEECH RECOGNITION SETUP
     ***********************************************************************/
    let recognition, finalTranscript = "";
    let mediaStream = null;
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const resultEl = document.getElementById("result");

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      alert("Your browser does not support the Speech Recognition API.");
    }

    // Yêu cầu truy cập micro ngay khi tải trang
    let preGrantedStream = null;
    window.addEventListener("load", () => {
      navigator.mediaDevices.getUserMedia({ audio: true })
        .then(stream => {
          preGrantedStream = stream;
          console.log("Microphone access granted.");
        })
        .catch(err => {
          console.error("Microphone access denied:", err);
          alert("Microphone access is required for recording.");
        });
    });

    function startRecording() {
      if (selectedLineId === null) {
        alert("Please select a line before recording.");
        return;
      }
      finalTranscript = "";
      resultEl.textContent = "Recording...";
      startBtn.disabled = true;
      stopBtn.disabled = false;

      // Dùng stream đã cấp phép nếu có
      if (preGrantedStream) {
        mediaStream = preGrantedStream;
      } else {
        navigator.mediaDevices.getUserMedia({ audio: true })
          .then(stream => { mediaStream = stream; })
          .catch(err => {
            console.error("Error accessing microphone:", err);
            alert("Unable to access the microphone.");
          });
      }

      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = false;
      recognition.lang = "en-US";
      recognition.start();

      recognition.onresult = (event) => {
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            finalTranscript += event.results[i][0].transcript + " ";
          }
        }
      };

      recognition.onerror = (event) => {
        console.error("Speech recognition error:", event.error);
      };

      recognition.onend = () => {
        // Recording dừng chỉ khi người dùng bấm nút "Stop Recording"
      };
    }

    function stopRecording() {
      if (recognition) recognition.stop();
      if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());
      startBtn.disabled = false;
      stopBtn.disabled = true;
      evaluatePronunciation();
    }

    startBtn.addEventListener("click", startRecording);
    stopBtn.addEventListener("click", stopRecording);

    /***********************************************************************
     * UTILS: LEVENSHTEIN DISTANCE & FUZZY MATCHING
     ***********************************************************************/
    // Tính khoảng cách Levenshtein giữa 2 chuỗi
    function levenshtein(a, b) {
      const matrix = [];
      for (let i = 0; i <= b.length; i++) {
        matrix[i] = [i];
      }
      for (let j = 0; j <= a.length; j++) {
        matrix[0][j] = j;
      }
      for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
          if (b.charAt(i - 1) === a.charAt(j - 1)) {
            matrix[i][j] = matrix[i - 1][j - 1];
          } else {
            matrix[i][j] = Math.min(
              matrix[i - 1][j - 1] + 1,
              matrix[i][j - 1] + 1,
              matrix[i - 1][j] + 1
            );
          }
        }
      }
      return matrix[b.length][a.length];
    }

    // Kiểm tra 2 từ có khớp theo fuzzy (cho phép sai lệch nhỏ, ngưỡng 30%)
    function isMatch(expected, recognized) {
      const dist = levenshtein(expected, recognized);
      return (dist / expected.length) < 0.3;
    }

    /***********************************************************************
     * EVALUATE PRONUNCIATION:
     * - Sử dụng phương pháp "hai con trỏ" và fuzzy matching để so sánh.
     * - Cho phép bỏ qua từ thừa (extra word) trong transcript.
     * - Nhóm lỗi theo loại: "Pronounce" (không cần nhấn) và "Emphasize" (cần nhấn).
     * - Hiển thị feedback với prefix (màu cam đỏ) và danh sách từ lỗi (màu vàng).
     ***********************************************************************/
    function evaluatePronunciation() {
      const expectedLine = parsedLines.find(line => line.id === Number(selectedLineId));
      if (!expectedLine) return;
      
      // Lấy mảng từ của expected (chuyển về lowercase)
      const expectedWords = expectedLine.words.map(w => w.text.toLowerCase());
      // Xử lý transcript: loại bỏ dấu câu, chuyển về lowercase và tách thành mảng từ
      const recognizedWords = finalTranscript.trim().toLowerCase().replace(/[.,?!]/g, "").split(/\s+/);
      
      const wordSpans = document.querySelector(`.line[data-id="${selectedLineId}"]`).querySelectorAll(".word");
      
      // Object chứa lỗi theo loại, dùng Set để gom nhóm các từ lỗi giống nhau
      let errorGroups = { "Pronounce": new Set(), "Emphasize": new Set() };
      
      let i = 0, j = 0;
      // Sử dụng phương pháp hai con trỏ
      while (i < expectedWords.length && j < recognizedWords.length) {
        if (isMatch(expectedWords[i], recognizedWords[j])) {
          wordSpans[i].classList.remove("error");
          i++; j++;
        } else if (j + 1 < recognizedWords.length && isMatch(expectedWords[i], recognizedWords[j + 1])) {
          // Giả sử recognizedWords[j] là từ thừa
          j++;
        } else {
          // Từ expectedWords[i] không khớp
          let type = expectedLine.words[i].stressed ? "Emphasize" : "Pronounce";
          errorGroups[type].add(expectedLine.words[i].text);
          wordSpans[i].classList.add("error");
          i++;
        }
      }
      // Nếu còn từ expected chưa được so sánh, đánh dấu lỗi
      while (i < expectedWords.length) {
        let type = expectedLine.words[i].stressed ? "Emphasize" : "Pronounce";
        errorGroups[type].add(expectedLine.words[i].text);
        wordSpans[i].classList.add("error");
        i++;
      }
      
      // Xây dựng HTML feedback dựa trên các nhóm lỗi
      let errorHTML = "";
      let speechMessages = [];
      for (let type in errorGroups) {
        const errors = Array.from(errorGroups[type]);
        if (errors.length > 0) {
          const wordList = errors.map(w => `"${w}"`).join(", ");
          errorHTML += `<div class="error-msg">
                          <span class="msg-prefix">Issue: ${type} </span>
                          <span class="error-word">${wordList}</span>
                        </div>`;
          speechMessages.push(`Issue: ${type} ${errors.map(w => `"${w}"`).join(", ")}`);
        }
      }
      
      if (speechMessages.length > 0) {
        resultEl.innerHTML = errorHTML;
        speakFeedback(speechMessages.join(". "));
      } else {
        resultEl.innerHTML = "";
      }
    }

    // Cung cấp phản hồi bằng âm thanh qua SpeechSynthesis (chỉ với từ lỗi)
    function speakFeedback(message) {
      if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(message);
        utterance.lang = "en-US";
        window.speechSynthesis.speak(utterance);
      }
    }
  </script>
</body>
</html>
